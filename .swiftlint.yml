included:
  - Shared
  - Engine
  - Pipeline
  - Injection
  - App
  - Providers
  - Lab
  - Actions
  - Tests
excluded:
  - .build
  - .build-*
  - Packaging/build

disabled_rules:
  - todo
  - trailing_comma
  - identifier_name
  - nesting

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 15
  error: 25
